<html>
<head>
    <title>Router Management App</title>
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
    <h1>You are calling me from {{request.remote_addr}}</h1>
    <h2>Add Router Credentials</h2>
    <form method="POST" action="/add">
        <input name="ip" placeholder="Router IP" required />
        <input name="username" placeholder="Username" required />
        <input name="password" type="password" placeholder="Password" required />
        <button type="submit">Add Router</button>
    </form>

    <h2>Router List</h2>
    <ul>
        {% for router in routers %}
          <li>
             IP: {{ router.ip }} | User: {{ router.username }} | Pass: {{ router.password }}
             <form method="POST" action="{{ url_for('delete_router') }}" style="display:inline">
               <input type="hidden" name="id" value="{{ router._id }}">
               <button type="submit">Delete</button>
             </form>
          </li>
        {% endfor %}
    </ul>
</body>
</html>
