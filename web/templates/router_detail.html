<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Router Detail</title>
    <style>
        body {
            background-color: #e8eaf6; /* Pastel Lavender/Blue */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #3f51b5;
            padding: 30px;
        }
        h1 {
            color: #283593;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        th, td {
            padding: 12px 15px;
            border: 1px solid #c5cae9;
            text-align: left;
        }
        th {
            background-color: #9fa8da;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f5f5f5;
        }
        a.back-btn {
            display: inline-block;
            margin-bottom: 15px;
            padding: 8px 14px;
            background-color: #7986cb;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <a href="/" class="back-btn">← Back to List</a>
    <h1>Router: {{ router_ip }}</h1>

    <table>
        <thead>
            <tr>
                <th>Timestamp</th>
                <th>Interface</th>
                <th>IP Address</th>
                <th>Status</th>
                <th>Protocol</th>
            </tr>
        </thead>
        <tbody>
        {% for log in logs %}
            {% for iface in log.interfaces %}
            <tr>
                <td>{{ log.timestamp }}</td>
                <td>{{ iface.interface }}</td>
                <td>{{ iface.ip_address }}</td>
                <td>{{ iface.status }}</td>
                <td>{{ iface.proto }}</td>
            </tr>
            {% endfor %}
        {% endfor %}
        </tbody>
    </table>
</body>
</html>
